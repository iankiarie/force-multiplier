// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.59.2'
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.2.0-2.0.2'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
